suite: security context
templates:
  - templates/deployment.yaml
  - templates/cronjobs.yaml
  - templates/mcp/deployment.yaml

set: &valid
  image.tag: "0.0.0-test"
  polytomicDeploymentId: "ut-deployment"
  auth.url: "https://polytomic.test"
  database.host: "postgres.example.com"
  externalRedis.host: "redis.example.com"
  operationalBucket.name: "ut-bucket"
  operationalBucket.region: "us-west-2"
  sharedVolume.mode: "dynamic"
  secrets.existing:
    - name: ut-secrets

tests:
  - it: sets RuntimeDefault seccomp and forbids privilege escalation on every app role
    set: *valid
    template: templates/deployment.yaml
    asserts:
      - hasDocuments:
          count: 7
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value: [ALL]

  - it: applies the same defaults to the summary CronJob
    set:
      <<: *valid
      cronjobs.jobs.weeklySummary.enabled: true
    template: templates/cronjobs.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: applies the same defaults to the MCP server
    set:
      <<: *valid
      mcp.enabled: true
    template: templates/mcp/deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
