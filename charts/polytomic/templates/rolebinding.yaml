{{- if .Values.serviceAccount.create -}}
{{- $ctx := dict "root" . "values" .Values "name" "" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "polytomic-base.fullname" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polytomic-base.labels" $ctx | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "polytomic-base.serviceAccountName" $ctx }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "polytomic-base.fullname" $ctx }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
