{{- if .Values.datadog.daemonset.enabled }}
{{- $ctx := dict "root" . "values" .Values "name" "" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polytomic-base.fullname" $ctx }}-datadog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "polytomic-base.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polytomic-base.fullname" $ctx }}-datadog
  labels:
    {{- include "polytomic-base.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: datadog
rules:
# Discovery
- apiGroups: [""]
  resources: [pods, nodes, services, events, endpoints, componentstatuses]
  verbs: [get, list, watch]
# Kubelet metrics
- apiGroups: [""]
  resources: [nodes/metrics, nodes/spec, nodes/proxy, nodes/stats]
  verbs: [get]
- nonResourceURLs: ["/version", "/healthz", "/metrics"]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "polytomic-base.fullname" $ctx }}-datadog
  labels:
    {{- include "polytomic-base.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: datadog
subjects:
- kind: ServiceAccount
  name: {{ include "polytomic-base.fullname" $ctx }}-datadog
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "polytomic-base.fullname" $ctx }}-datadog
  apiGroup: rbac.authorization.k8s.io
{{- end }}
