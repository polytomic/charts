suite: secret sources
templates:
  - templates/deployment.yaml
  - templates/externalsecret.yaml

tests:
  - it: fails without a secret source
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: no primary secret

  - it: prefers the first external entry as the primary secret
    set:
      secrets.existing:
        - name: existing
      secrets.external.entries:
        - name: eso
          source:
            path: some/path
          data:
            - KEY
    template: templates/deployment.yaml
    asserts:
      - notFailedTemplate: {}

  - it: attaches existing secrets with envFrom
    set:
      secrets.existing:
        - name: one
        - name: two
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: one
      - equal:
          path: spec.template.spec.containers[0].envFrom[2].secretRef.name
          value: two

  - it: attaches external entries before existing secrets
    set:
      secrets.existing:
        - name: existing
      secrets.external.entries:
        - name: eso
          source:
            path: some/path
          data:
            - KEY
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: eso
      - equal:
          path: spec.template.spec.containers[0].envFrom[2].secretRef.name
          value: existing

  - it: renders an ExternalSecret with the default v1 API and asm store
    set:
      secrets.external.entries:
        - name: eso
          source:
            path: some/path
          data:
            - KEY
            - k8sKey: OTHER
              remoteKey: other_remote
    template: templates/externalsecret.yaml
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.data[0].secretKey
          value: KEY
      - equal:
          path: spec.data[0].remoteRef.property
          value: KEY
      - equal:
          path: spec.data[1].secretKey
          value: OTHER
      - equal:
          path: spec.data[1].remoteRef.property
          value: other_remote

  - it: honors secrets.external.apiVersion
    set:
      secrets.external.apiVersion: external-secrets.io/v1beta1
      secrets.external.entries:
        - name: eso
          source:
            path: some/path
          data:
            - KEY
    template: templates/externalsecret.yaml
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1

  - it: supports the gcpsm source type
    set:
      secrets.external.entries:
        - name: eso
          source:
            type: gcpsm
            path: some/path
          data:
            - KEY
    template: templates/externalsecret.yaml
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: gcp-secret-manager

  - it: rejects unknown source types
    set:
      secrets.external.entries:
        - name: eso
          source:
            type: vault
            path: some/path
          data:
            - KEY
    template: templates/externalsecret.yaml
    asserts:
      - failedTemplate:
          errorPattern: unsupported secrets.external.source.type
