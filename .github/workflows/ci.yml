name: CI

on:
  pull_request:
    # labeled/unlabeled so toggling a release:<chart> label re-runs the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a PR cancels the older run so the report comment always
# reflects the latest commit. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  HELM_VERSION: v4.2.4
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install plugins and scanners
        run: make tools check-tools

      - name: Dependencies
        run: make deps

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Render fixtures and validate against Kubernetes schemas
        run: make kubeconform

      - name: Check values.schema.json is current
        run: make schema-check

      - name: kubeconform report
        if: always()
        run: make kubeconform-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-kubeconform
          path: build/report/kubeconform.md

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: zizmor and actionlint
        run: make check-tools workflow-lint

  scan:
    # Report only: findings land in the Security tab and never fail the build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Trivy misconfiguration scan
        run: make tools check-tools deps trivy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-sarif
          path: build/trivy.sarif

      - name: Trivy report
        if: always()
        run: make trivy-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-trivy
          path: build/report/trivy.md

      # Fork PR tokens cannot write security events.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: build/trivy.sarif
          category: trivy

  report:
    # One PR comment, updated in place, with the kubeconform and Trivy
    # summaries. Fork PR tokens cannot comment.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: build/report

      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ci-report -->"
            echo "## CI report"
            echo
            echo "[Run]($SERVER/$REPO/actions/runs/$RUN_ID) · [Trivy alerts on this PR]($SERVER/$REPO/security/code-scanning?query=pr%3A$PR+tool%3ATrivy)"
            echo
            for part in kubeconform trivy; do
              if [[ -s "build/report/$part.md" ]]; then
                cat "build/report/$part.md"
              else
                echo "### $part"
                echo
                echo "Not produced: the job failed before it ran."
              fi
              echo
            done
          } > body.md
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- ci-report -->")) | .id')
          id=${ids%%$'\n'*}
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --silent
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md --silent
          fi

  release-check:
    # A chart labelled release:<chart> must carry a releasable version and a
    # changelog entry; merging the PR publishes it (release.yml). Unlabelled
    # PRs have no version rules.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check labelled charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          for chart in polytomic-base polytomic; do
            if jq -e --arg l "release:$chart" 'index($l) != null' <<<"$LABELS" >/dev/null; then
              scripts/release-check.sh "$chart"
            else
              echo "$chart: no release:$chart label, skipped"
            fi
          done

  publish:
    # Every green push to main publishes both charts as prereleases,
    # <Chart.yaml version>-<short sha>, so a build can be pinned in a staging
    # environment before it is released. Main always holds the next release
    # version, so `helm install --version X.Y.Z` never selects a dev build.
    # Releases themselves come from merged PRs labelled release:<chart>.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Dependencies
        run: make deps

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=8 HEAD)
          out=$(mktemp -d)
          for chart in charts/polytomic-base charts/polytomic; do
            version=$(awk -F'[: \t]+' '/^version:/ {gsub(/["'\'']/, "", $2); print $2; exit}' "$chart/Chart.yaml")
            helm package "$chart" --destination "$out" --version "$version-$sha"
          done
          for tgz in "$out"/*.tgz; do
            helm push "$tgz" "$REGISTRY"
          done
