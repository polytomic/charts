name: Release

# A tag named <chart>-<version> publishes that chart at that version:
#   polytomic-2.0.0, polytomic-base-1.0.0
# The pushed chart is signed with cosign (keyless) and gets a GitHub build
# provenance attestation; see README.md "Verifying a release".

on:
  push:
    tags:
      - "polytomic-[0-9]*"
      - "polytomic-base-[0-9]*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  HELM_VERSION: v4.2.4
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve chart from tag
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            polytomic-base-*) name=polytomic-base; version="${tag#polytomic-base-}" ;;
            polytomic-*)      name=polytomic;      version="${tag#polytomic-}" ;;
            *) echo "::error::unrecognised tag $tag"; exit 1 ;;
          esac
          declared=$(awk -F'[: \t]+' '/^version:/ {gsub(/["'\'']/, "", $2); print $2; exit}' "charts/$name/Chart.yaml")
          if [[ "$declared" != "$version" ]]; then
            echo "::error::tag $tag names version $version but charts/$name/Chart.yaml declares $declared"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install plugins
        run: make tools

      - name: Dependencies
        run: make deps

      - name: Lint and test
        run: make lint test

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Package and push
        id: push
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          helm package "charts/$NAME" --destination "$out"
          pushed=$(helm push "$out"/*.tgz "$REGISTRY" 2>&1 | tee /dev/stderr)
          digest=$(sed -n 's/^Digest: //p' <<<"$pushed")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not parse a digest from helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/charts/${{ steps.tag.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/${{ steps.tag.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
