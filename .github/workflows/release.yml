name: Release

# A push to main whose merged PR carries release:<chart> labels publishes those
# charts at the version in their Chart.yaml, signs them (cosign keyless), attests
# build provenance, and finally tags <chart>-<version>. The tag is the "released"
# marker and is created last, so a run that fails earlier can simply be re-run.
# See README.md "Releasing" and "Verifying a release".

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.4
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  charts:
    # Which charts this push releases: the release:* labels of the merged PR.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      charts: ${{ steps.labels.outputs.charts }}
    steps:
      - id: labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          charts=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '
            [.[] | select(.merged_at != null) | .labels[].name
              | select(. == "release:polytomic" or . == "release:polytomic-base")
              | ltrimstr("release:")] | unique | tojson')
          echo "releasing: $charts"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  release:
    needs: charts
    if: needs.charts.outputs.charts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.charts.outputs.charts) }}
    # Serialise releases of one chart; never cancel a publish midway.
    concurrency:
      group: release-${{ matrix.chart }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CHART: ${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install plugins and dependencies
        run: make tools deps

      - name: Lint and test
        run: make lint test

      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/release-check.sh --allow-published "$CHART"
          version=$(awk -F'[: \t]+' '/^version:/ {gsub(/["'\'']/, "", $2); print $2; exit}' "charts/$CHART/Chart.yaml")
          tag="$CHART-$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag exists; $CHART $version was already released"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      # Only does anything when a previous run failed after helm push: the
      # version is on GHCR without a tag. Removing it keeps the push below a
      # fresh publish, never an overwrite.
      - name: Remove an untagged earlier push of this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: scripts/ghcr.sh delete "$CHART" "$VERSION"

      - name: Package and push
        id: push
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          helm package "charts/$CHART" --destination "$out"
          pushed=$(helm push "$out"/*.tgz "$REGISTRY" 2>&1 | tee /dev/stderr)
          digest=$(sed -n 's/^Digest: //p' <<<"$pushed")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not parse a digest from helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/charts/${{ matrix.chart }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
          SHA: ${{ github.sha }}
        run: gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" --silent
